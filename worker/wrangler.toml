# Rack — AI food estimator proxy
#
# Nothing secret belongs in this file. It is committed to a public repo.
# The API key is set with:  npx wrangler secret put ANTHROPIC_API_KEY
# and lives encrypted in Cloudflare, readable only by the running Worker.

name = "rack-ai"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Public settings. Change one, run `npx wrangler deploy`, it is live in seconds.
[vars]
# Who may call this from a browser. Add http://localhost:8000 while developing.
ALLOWED_ORIGINS = "https://lyttlebeast.github.io"

# Who may spend your credits.
#
# The everyday answer is not here any more — it is the aiAllow/{uid} node in the
# database, which the app writes when an account is approved and which only the
# owner can block. That means adding a person to Rack gives them the estimator
# without touching this file, and taking it away from them is a tap in the app.
#
# This list is now an OVERRIDE and a safety net: any uid named here is allowed
# with no database lookup at all, so put your own uid here and the estimator
# keeps working even if Firebase is unreachable. Comma-separated.
ALLOWED_UIDS = "aXSDfnZK8IMT9wRVhBbEgkDHpsj2"

# The Firebase project whose ID tokens count as valid here.
FIREBASE_PROJECT_ID = "lift-cal"

# Rate limits — PER ACCOUNT, per day. Every person gets their own counters, so
# a second user can never eat the first one's allowance.
#
# Photo and text are counted separately on purpose. A photo costs roughly ten
# times what the same meal costs described, so a single shared counter lets a
# run of cheap text estimates quietly spend the expensive ones — and you find
# out at dinner, holding a plate. Using one of each in a day counts one against
# each, not two against one.
#
# The two per-day numbers are the DEFAULT allowance. The owner can raise a single
# account past them from the app, and never past the ceiling in src/index.js —
# 12 photo, 30 text. The per-minute limit is the same for everybody.
RATE_PER_MINUTE   = "5"
AI_PHOTO_PER_DAY  = "3"
AI_TEXT_PER_DAY   = "3"

# The one that actually protects the money. Dollars of Anthropic usage per
# calendar month, counted from Anthropic's own token numbers.
#
# This is the DEFAULT for an account that has no number of its own. The owner
# sets a per-person cap in the app (admin -> AI allowance), it lands in
# aiAllow/{uid}/monthlyUsd, and the Worker clamps it at $10 -- so one person can
# be given room without giving it to everybody, which is the whole point.
#
# Scale, from the price table above: a photo estimate is about $0.006 and a
# typed description a fraction of a cent, so ordinary use at 3 photos a day is
# roughly $0.55 a month. $2 is about three times that -- slack enough not to
# bite an honest month, tight enough to stop a loop.
MONTHLY_USD_CAP = "2"

# The ceiling for EVERYONE COMBINED, in the same month. Per-account caps bound
# each person and say nothing about their sum -- seven people at $2 each is $14
# the month something goes wrong, and the first you would hear of it is a dead
# API key. This counter lives in KV under spend:global and refuses everybody,
# with a message that says so, once the month crosses it.
#
# Seven people at ordinary use is about $4 a month, so $10 is comfortable
# headroom and still a hard stop. Raise it deliberately; it is the last wall
# before your Anthropic balance is the wall.
GLOBAL_MONTHLY_USD_CAP = "10"

# Counter storage — also caches the aiAllow lookup for a minute per uid.
# Create it once with:
#   npx wrangler kv namespace create RACK_AI
# then paste the id it prints here.
[[kv_namespaces]]
binding = "RACK_AI"
id = "0799c27cab1549458c3d66a1e5707121"
