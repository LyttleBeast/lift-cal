<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rack">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
/* This device's vibe, on <html> before the first frame (vibe.js). A classic
   inline script, and above the stylesheets on purpose: a script after a
   pending stylesheet waits for it. The key sits outside the per-account
   namespace, like rack:migrated, because nobody is signed in yet; v1 is its
   absence, and so is anything that is not an id. */
(function () {
  var THEME = { 'iron-age': '#14161a', chalk: '#14161a', navy: '#0a183b', oxblood: '#1a0f11', ledger: '#0e1813', 'clear-sky': '#14161a', 'meet-day': '#07080a' };   // vibe id -> its theme-color; each vibe adds its entry
  try {
    var v = localStorage.getItem('rack:vibe');
    if (v && v !== 'v1' && v.length <= 32 && /^[a-z0-9][a-z0-9-]*$/.test(v)) {
      document.documentElement.dataset.vibe = v;
      if (Object.prototype.hasOwnProperty.call(THEME, v))
        document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME[v]);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="rack.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="vibes/iron-age.css">
<link rel="stylesheet" href="vibes/chalk.css">
<link rel="stylesheet" href="vibes/navy.css">
<link rel="stylesheet" href="vibes/oxblood.css">
<link rel="stylesheet" href="vibes/ledger.css">
<link rel="stylesheet" href="vibes/clear-sky.css">
<link rel="stylesheet" href="vibes/meet-day.css">
<title>Rack</title>
</head>
<body>

<!-- ===== AUTH GATE =====
     One box, two modes. `data-mode` on the box is what decides which fields
     are on screen; auth.css hides the rest. Keeping both modes in the markup
     rather than building them in JavaScript means the sign-in form is painted
     with the first frame instead of a step later, which on a cold PWA start is
     the difference between "an app" and "a web page loading". -->
<div id="auth">
  <div class="auth-box" id="authBox" data-mode="in">
    <div class="auth-mark" aria-hidden="true">
      <i style="background:var(--p-red);animation-delay:0ms"></i>
      <i style="background:var(--p-blue);animation-delay:60ms"></i>
      <i style="background:var(--p-yellow);animation-delay:120ms"></i>
      <i style="background:var(--p-green);animation-delay:180ms"></i>
      <i style="background:var(--p-white);animation-delay:240ms"></i>
      <i style="background:var(--p-chrome);animation-delay:300ms"></i>
    </div>

    <h1 class="auth-title" id="authTitle">Sign in</h1>
    <p class="auth-sub" id="authSub">Your training log, your account.</p>

    <div class="field only-up">
      <label for="authName">Name</label>
      <input id="authName" type="text" autocomplete="name" autocapitalize="words">
    </div>

    <div class="field">
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
    </div>

    <div class="field">
      <label for="authPass">Password</label>
      <input id="authPass" type="password" autocomplete="current-password">
      <div class="field-hint only-up">At least 8 characters.</div>
    </div>

    <div class="field only-up">
      <label for="authCode">Invite code <span class="opt">optional</span></label>
      <input id="authCode" class="code-input" type="text" placeholder="ABCDE-FGHJK"
             autocapitalize="characters" spellcheck="false" maxlength="12">
      <div class="field-hint">Got a code from Micah? It lets you straight in. Without one he gets a request to approve.</div>
    </div>

    <div class="auth-err" id="authErr"></div>
    <div class="auth-ok" id="authOk"></div>

    <button class="btn btn-primary btn-block btn-lg" id="authBtn">Sign in</button>

    <div class="auth-alt">
      <button class="linkish only-in" id="authForgot" type="button">Forgot password</button>
      <button class="linkish" id="authSwap" type="button">Create an account</button>
    </div>
  </div>
</div>

<!-- ===== ACCESS GATE (signed in, not approved yet) ===== -->
<div id="gate" class="hidden"></div>

<!-- ===== ONBOARDING / TOUR ===== -->
<div id="onboard" class="hidden"></div>

<!-- ===== SYNC STATE ===== -->
<div class="sync-pip" id="syncPip"><i></i><span>synced</span></div>

<!-- ===== APP ===== -->
<div id="app">
  <!-- You is first and starts active because it is the screen the app opens on,
       so the markup and the dock agree from the first frame. initYou() runs last
       in boot but paints its skeleton synchronously, so the tab is never an
       empty box once boot reaches it — and if it throws, restoreView() sends
       everyone to Train instead. -->
  <section class="view active" id="view-you"></section>
  <section class="view" id="view-workout"></section>
  <section class="view" id="view-food"></section>
  <section class="view" id="view-weight"></section>
  <section class="view" id="view-steps"></section>
</div>

<!-- ===== DOCK ===== -->
<nav class="dock" id="dock">
  <button data-view="you" class="active" aria-label="Your summary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.4 8.2a3.6 3.6 0 1 0 7.2 0 3.6 3.6 0 1 0-7.2 0z"/>
      <path d="M5 20c.4-3.7 3.4-5.8 7-5.8s6.6 2.1 7 5.8"/>
    </svg>
    You
  </button>
  <button data-view="workout" aria-label="Training">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10"/>
    </svg>
    Train
  </button>
  <button data-view="food" aria-label="Nutrition">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3v8a3 3 0 0 0 6 0V3M9 11v10M18 3c-1.5 2-2 4-2 6s.5 3 2 3 2-1 2-3-.5-4-2-6zM18 12v9"/>
    </svg>
    Fuel
  </button>
  <button data-view="weight" aria-label="Body weight">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 17l5-6 4 3 5-7 4 5"/><path d="M3 21h18"/>
    </svg>
    Weight
  </button>
  <button data-view="steps" aria-label="Steps">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 20c-1.7 0-2.7-1.2-2.4-2.9.2-1.3.9-2.3.9-3.6 0-1-.3-1.8-.3-2.8C5.2 8.5 6.5 7 8.4 7c1.8 0 2.9 1.3 2.9 3.1 0 1.4-.5 2.5-.5 3.9 0 1.1.4 1.9.4 3 0 1.9-1.2 3-2.9 3z"/>
      <path d="M16.4 16c1.7 0 2.7-1.2 2.4-2.9-.2-1.3-.9-2.3-.9-3.6 0-1 .3-1.8.3-2.8C18.2 4.5 16.9 3 15 3c-1.8 0-2.9 1.3-2.9 3.1 0 1.4.5 2.5.5 3.9 0 1.1-.4 1.9-.4 3 0 1.9 1.2 3 2.9 3z"/>
    </svg>
    Steps
  </button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
